services:
  db:
    image: postgres:18
    container_name: weather_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-weather_at_your_fingertips_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-weather_at_your_fingertips_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - weather_db_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: weather_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:password@db:5432/weather_at_your_fingertips_db}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"

volumes:
  weather_db_data:
    name: weather_at_your_fingertips_db_postgres_data
