services:
  db:
    image: postgres:18
    container_name: weather_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: weather_at_your_fingertips_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - weather_at_your_fingertips_db_postgres_data:/var/lib/postgresql

  backend:
    build: ./backend
    container_name: weather_backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:password@db:5432/weather_at_your_fingertips_db}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: weather_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN}

volumes:
  weather_at_your_fingertips_db_postgres_data:
    name: weather_at_your_fingertips_db_postgres_data
